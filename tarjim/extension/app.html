<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="appName">tarjim</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="controls.css">
  <link rel="stylesheet" href="star.css">
</head>
<body>
  <header class="bar">
    <h1 class="mark">
      <svg class="mark-glyph" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="8" width="18" height="3.2" rx="1.6" class="mark-top"/>
        <rect x="6" y="13.6" width="12" height="3.2" rx="1.6" class="mark-bottom"/>
      </svg>
      <span data-i18n="appName">tarjim</span>
    </h1>
    <p class="link-state" id="link-state" data-state="unknown"><span class="dot" aria-hidden="true"></span><span id="link-text"></span></p>
    <button class="icon-button" id="open-settings" type="button" data-i18n-label="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.5 7.5 0 0 0-2.6-1.5L14.1 2.6h-4l-.4 2.4a7.5 7.5 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9a7.5 7.5 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a7.5 7.5 0 0 0 2.6-1.5l2.3.9 2-3.4-2-1.5Z"/></svg>
    </button>
  </header>

  <main>
    <section class="view" id="view-main" hidden>
      <form id="order" novalidate>
        <div class="source" id="source-tab">
          <p class="eyebrow" data-i18n="sourceTab"></p>
          <p class="source-title" id="tab-title"></p>
          <p class="source-host" id="tab-host"></p>
        </div>
        <div class="source source-none" id="source-none" hidden>
          <p class="source-title" data-i18n="sourceNone"></p>
          <p class="source-host" data-i18n="sourceNoneHint"></p>
        </div>
        <div class="drop" id="drop" hidden>
          <input type="file" id="file" accept="video/*,audio/*" class="visually-hidden">
          <label for="file" class="drop-zone" id="drop-zone">
            <span class="drop-title" data-i18n="dropTitle"></span>
            <span class="drop-hint" data-i18n="dropHint"></span>
            <span class="button-quiet" data-i18n="chooseFile"></span>
          </label>
          <p class="drop-file" id="drop-file" hidden></p>
          <label class="field-label" for="link" data-i18n="linkLabel"></label>
          <input class="text-input" id="link" type="url" inputmode="url" dir="ltr" placeholder="https://">
        </div>
        <div class="field quality" id="quality-field" hidden>
          <label class="field-label" for="quality" data-i18n="quality"></label>
          <select id="quality" class="select" hidden></select>
          <p class="meta quality-note" id="quality-note" role="status" aria-live="polite"></p>
        </div>
        <button class="button-quiet wide" id="open-file-page" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4.5 4.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
          <span data-i18n="pickFile"></span>
        </button>

        <div class="field">
          <label class="field-label" for="target" data-i18n="language"></label>
          <select id="target" class="select"></select>
        </div>

        <fieldset class="field" id="dialect-field">
          <legend class="field-label" data-i18n="dialect"></legend>
          <div class="segments">
            <label><input type="radio" name="dialect" value="saudi"><span data-i18n="dialectSaudi"></span></label>
            <label><input type="radio" name="dialect" value="msa"><span data-i18n="dialectMsa"></span></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend class="field-label" data-i18n="output"></legend>
          <div class="segments">
            <label><input type="radio" name="mode" value="burn"><span data-i18n="outputBurn"></span></label>
            <label><input type="radio" name="mode" value="srt"><span data-i18n="outputSrt"></span></label>
            <label><input type="radio" name="mode" value="dub"><span data-i18n="outputDub"></span></label>
          </div>
        </fieldset>

        <div class="field" id="voice-field" hidden>
          <label class="field-label" for="voice" data-i18n="voice"></label>
          <select id="voice" class="select">
            <option value="gemini" data-key="gemini" data-i18n="voiceNatural"></option>
            <option value="clone" data-i18n="voiceClone"></option>
            <option value="studio" data-i18n="voiceStudio"></option>
            <option value="fish" data-key="fish" data-i18n="voiceFish"></option>
            <option value="fishvoice" id="voice-narrator" data-key="fish" data-i18n="voiceNarrator"></option>
            <option value="eleven" data-linked="eleven" data-i18n="voiceEleven" hidden></option>
            <option value="elevenclone" data-linked="eleven" data-i18n="voiceElevenClone" hidden></option>
            <option value="speech" data-linked="speech" data-i18n="voiceSpeech" hidden></option>
          </select>
          <p class="meta keys-line" id="voice-keys" hidden><span data-i18n="voiceKeys"></span> <button class="text-button" id="open-voice-keys" type="button" data-i18n="addKey"></button></p>
        </div>

        <div class="upload" id="upload" hidden>
          <div class="meter"><span id="upload-bar"></span></div>
          <p class="meta" id="upload-text"></p>
        </div>
        <details class="engine" id="engine">
          <summary><span class="engine-with" data-i18n="engineWith"></span> <bdi class="engine-now" id="engine-now"></bdi><span class="engine-change" data-i18n="engineChange"></span></summary>
          <div class="engine-body">
            <div class="field">
              <label class="field-label" for="engine-provider" data-i18n="engineProvider"></label>
              <select class="select" id="engine-provider"></select>
            </div>
            <div class="field">
              <label class="field-label" for="engine-model" data-i18n="engineModel"></label>
              <select class="select" id="engine-model"></select>
            </div>
            <p class="meta engine-note" id="engine-note" role="status" aria-live="polite"></p>
            <p class="meta keys-line engine-keys"><span data-i18n="engineKeys"></span> <button class="text-button" id="open-keys" type="button" data-i18n="addKey"></button></p>
          </div>
        </details>
        <button class="primary" id="go" type="submit" data-i18n="translate"></button>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
      </form>

      <section class="star" id="star" aria-labelledby="star-title" hidden>
        <svg class="star-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.55 5.17 5.7.83-4.13 4.02.98 5.68L12 16.62 6.9 19.3l.98-5.68L3.75 9.6l5.7-.83z"/></svg>
        <div class="star-body">
          <h2 class="star-title" id="star-title" data-i18n="starTitle"></h2>
          <p class="star-text" data-i18n="starText"></p>
          <div class="star-actions">
            <button class="star-yes" id="star-yes" type="button" data-i18n="starYes"></button>
            <button class="star-other" id="star-later" type="button" data-i18n="starLater"></button>
            <button class="star-other" id="star-no" type="button" data-i18n="starNo"></button>
          </div>
          <p class="star-said" id="star-said" role="status" tabindex="-1"></p>
        </div>
      </section>

      <section class="recent" aria-labelledby="recent-title">
        <h2 class="section-title" id="recent-title" tabindex="-1" data-i18n="recent"></h2>
        <p class="empty" id="empty" data-i18n="empty" hidden></p>
        <ul class="jobs" id="jobs"></ul>
      </section>
    </section>

    <section class="view panel" id="view-offline" hidden>
      <h2 class="panel-title" data-i18n="offlineTitle"></h2>
      <p class="not-windows" data-i18n="offlineBody"></p>
      <code class="command not-windows" dir="ltr">tarjim-serve</code>
      <p class="windows-only" data-i18n="offlineWindows"></p>
      <button class="primary" id="retry-connect" type="button" data-i18n="tryAgain"></button>
      <p class="notice" id="offline-note" role="status" aria-live="polite"></p>
    </section>

    <section class="view panel" id="view-pair" hidden>
      <h2 class="panel-title" data-i18n="pairTitle"></h2>
      <button class="primary" id="pair-auto" type="button" data-i18n="pairAuto"></button>
      <p class="notice" id="pair-waiting" role="status" hidden></p>
      <button class="text-button" id="open-tarjim" type="button" data-i18n="openTarjim" hidden></button>
      <details class="advanced">
        <summary data-i18n="pairManualTitle"></summary>
        <p class="meta not-windows" data-i18n="pairManual"></p>
        <code class="command not-windows" dir="ltr">tarjim-serve --show-token</code>
        <form id="pair-form" class="stack" novalidate>
          <label class="field-label" for="token" data-i18n="tokenLabel"></label>
          <input class="text-input" id="token" type="password" dir="ltr" autocomplete="off" spellcheck="false" required>
          <p class="error" id="pair-error" role="alert" hidden data-i18n="pairWrong"></p>
          <button class="primary" type="submit" data-i18n="pair"></button>
        </form>
      </details>
    </section>

    <section class="view panel" id="view-setup" hidden>
      <h2 class="panel-title" data-i18n="setupTitle"></h2>
      <p data-i18n="setupBody"></p>
      <button class="primary" id="open-setup" type="button" data-i18n="setupOpen"></button>
      <button class="text-button" id="setup-done" type="button" data-i18n="setupDone"></button>
      <p class="notice" id="setup-note" role="status" aria-live="polite"></p>
    </section>

    <section class="view panel settings-view" id="view-settings" hidden>
      <div class="settings-head">
        <h2 class="panel-title" data-i18n="settings"></h2>
        <button class="button-quiet" id="close-settings" type="button" data-i18n="back"></button>
      </div>
      <section class="settings-group" aria-labelledby="group-link">
        <h3 class="group-title" id="group-link" data-i18n="settingsGroupLink"></h3>
        <dl class="summary" id="connection-summary"></dl>
        <div class="group-buttons">
          <button class="button-quiet wide" id="open-all-settings" type="button" data-i18n="settingsAll"></button>
          <button class="button-quiet wide" id="open-keys-settings" type="button" data-i18n="keysButton"></button>
          <button class="button-quiet wide" id="open-phone" type="button" data-i18n="phoneLinkButton"></button>
        </div>
        <button class="text-button" id="open-full-setup" type="button" data-i18n="setupFull"></button>
      </section>
      <fieldset class="settings-group" id="text-mode">
        <legend class="group-title" data-i18n="textModeLabel"></legend>
        <div class="segments">
          <label><input type="radio" name="textMode" value="menu"><span data-i18n="textModeMenu"></span></label>
          <label><input type="radio" name="textMode" value="button"><span data-i18n="textModeButton"></span></label>
          <label><input type="radio" name="textMode" value="card"><span data-i18n="textModeCard"></span></label>
        </div>
        <p class="notice" id="text-mode-note" role="status" aria-live="polite"></p>
      </fieldset>
      <details class="advanced settings-group">
        <summary class="group-title" data-i18n="advanced"></summary>
        <form id="settings-form" class="stack" novalidate>
          <label class="field-label" for="server" data-i18n="serverLabel"></label>
          <input class="text-input" id="server" dir="ltr" type="url" required>
          <label class="field-label" for="settings-token" data-i18n="tokenLabel"></label>
          <input class="text-input" id="settings-token" type="password" dir="ltr" autocomplete="off" spellcheck="false">
          <label class="field-label" for="settings-fish" data-i18n="keyFishLabel"></label>
          <input class="text-input" id="settings-fish" type="password" dir="ltr" autocomplete="off" spellcheck="false">
          <p class="notice" id="settings-notice" role="status" aria-live="polite"></p>
          <button class="button-quiet" type="submit" data-i18n="save"></button>
        </form>
      </details>
    </section>
  </main>
  <footer class="made-by">
    <a href="https://indicators.sa/" target="_blank" rel="noopener">
      <img class="logo-light" src="icons/indicators.png" alt="Indicators" height="24">
      <img class="logo-dark" src="icons/indicators-white.png" alt="Indicators" height="24">
      <span data-i18n="madeBy"></span><span aria-hidden="true">·</span><span dir="ltr" class="made-by-site">indicators.sa</span>
    </a>
  </footer>

  <p class="visually-hidden" id="announcer" aria-live="polite"></p>

  <template id="job-template">
    <li class="job">
      <div class="job-head">
        <p class="job-title"></p>
        <p class="job-stage"></p>
      </div>
      <p class="meta job-meta"></p>
      <ol class="track" aria-hidden="true"></ol>
      <p class="error job-error" hidden></p>
      <p class="meta job-note" role="status" hidden></p>
      <div class="job-actions" hidden></div>
      <p class="meta job-notes" role="status" hidden></p>
      <section class="job-post" hidden></section>
    </li>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
