[project]
name = "tarjim"
version = "0.1.0"
description = "Professional, speaker-aware Arabic subtitles for any video"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "soundfile",
    "google-genai",
    "qwen-asr",
    "transformers",
    "uroman",
    "silero-vad",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
tarjim = "tarjim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tarjim*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "SIM", "PL", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 20
max-branches = 6

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
