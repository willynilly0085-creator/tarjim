[project]
name = "tarjim"
version = "0.1.0"
description = "Subtitles and dubbing for any video, from any language to any language, on your own computer"
requires-python = ">=3.11"
license = { text = "Apache-2.0 with Commons Clause 1.0" }
dependencies = [
    "numpy",
    "soundfile",
    "google-genai",
    "qwen-asr",
    "transformers",
    "uroman",
    "silero-vad",
    "yt-dlp",
    "keyring",
    "mcp>=2.2",
    "requests",
    "huggingface_hub",
]

[project.urls]
Homepage = "https://github.com/willynilly0085-creator/tarjim"
Issues = "https://github.com/willynilly0085-creator/tarjim/issues"

[project.optional-dependencies]
dub = ["coqui-tts==0.27.5", "torchcodec", "demucs", "catt-tashkeel", "edge-tts", "fish-audio-sdk",
       "num2words", "librosa"]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
tarjim = "tarjim.cli:main"
tarjim-serve = "tarjim.server.__main__:main"
tarjim-mcp = "tarjim.assistant:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tarjim*"]

[tool.setuptools.package-data]
tarjim = ["web/*", "web/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "SIM", "PL", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 20
max-branches = 6

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
