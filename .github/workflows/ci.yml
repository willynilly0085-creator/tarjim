name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ffmpeg, so the download tests that merge or record streams run here too.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      # The tested versions (tarjim/constraints.txt) are the ones people get.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -c tarjim/constraints.txt -e ".[dev]"
      - run: ruff check tarjim tests
      - run: mypy tarjim
      - run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      # Known vulnerabilities in the tested versions; the ones listed, with reasons, in
      # .github/audit-known.txt are reported but do not fail the check.
      - run: >-
          pip-audit --disable-pip --no-deps --progress-spinner off -r tarjim/constraints.txt
          $(sed -n 's/^\([A-Z][A-Z0-9-]*\) .*/--ignore-vuln \1/p' .github/audit-known.txt)
