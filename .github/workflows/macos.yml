name: macos

# GitHub's macOS runners are often not available for a long time, so this runs apart from the
# main checks: weekly and on request, as evidence for a platform nobody has tested by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 6"

jobs:
  gates:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - run: ruff check tarjim tests
      - run: mypy tarjim
      - run: pytest -q
