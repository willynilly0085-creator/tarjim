name: macos

# GitHub's macOS runners are often not available for a long time, so this runs apart from the
# main checks: weekly and on request, as evidence for a platform nobody has tested by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 6"

jobs:
  gates:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      # uv applies tarjim/overrides.txt; pip cannot.
      - run: uv pip install --system -c tarjim/constraints.txt --overrides tarjim/overrides.txt -e ".[dev]"
      - run: ruff check tarjim tests
      - run: mypy tarjim
      - run: pytest -q
